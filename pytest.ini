[pytest]
# Pytest configuration for RouteThis agents

testpaths = agents/v1
python_files = test_*.py conftest.py
python_classes = Test*
python_functions = test_*

# Display output
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

markers =
    unit: Unit tests (mocked LLM, isolated node logic)
    integration: Integration tests (full graph execution)
    rag: RAG pipeline tests (retrieval, metadata filtering)
    prompts: Prompt template and LLM response tests
    scenarios: Conversation scenario tests
    edge_case: Edge case and error handling tests

# Coverage options (if using pytest-cov)
# --cov=agents/v1 --cov-report=html --cov-fail-under=70
